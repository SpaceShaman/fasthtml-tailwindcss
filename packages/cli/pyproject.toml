[project]
name = "fasthtml-tailwindcss-cli"
version = "4.3.3"
description = "Platform-specific Tailwind CSS standalone CLI binary for fasthtml-tailwindcss."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "TAILWIND-LICENSE"]
authors = [{ name = "SpaceShaman", email = "spaceshaman@tuta.io" }]
keywords = ["tailwindcss", "cli", "binary"]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Build Tools",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fasthtml_tailwindcss_cli"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/hatch_build.py", "/binaries.json", "/pyproject.toml", "/README.md", "/LICENSE", "/TAILWIND-LICENSE"]
exclude = ["/src/fasthtml_tailwindcss_cli/bin"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
