[project]
name = "fasthtml-tailwindcss"
version = "4.3.3.post1"
description = "Tailwind CSS for FastHTML with a persistent development watcher and a build command for production CSS."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SpaceShaman", email = "spaceshaman@tuta.io" }]
keywords = ["components", "css", "fasthtml", "tailwindcss", "web"]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["filelock>=3.16", "python-fasthtml>=0.14.13"]

[project.optional-dependencies]
dev = ["fasthtml-tailwindcss-cli>=4,<5"]

[project.scripts]
fasthtml-tailwindcss = "fasthtml_tailwindcss.build:main"

[tool.uv.sources]
fasthtml-tailwindcss-cli = { path = "packages/cli" }

[project.urls]
Documentation = "https://github.com/SpaceShaman/fasthtml-tailwindcss#readme"
Homepage = "https://github.com/SpaceShaman/fasthtml-tailwindcss"
Issues = "https://github.com/SpaceShaman/fasthtml-tailwindcss/issues"
Repository = "https://github.com/SpaceShaman/fasthtml-tailwindcss"

[dependency-groups]
build = ["hatchling>=1.27"]
test = ["httpx", "pytest", "uvicorn"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fasthtml_tailwindcss"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/packages/cli", "/pyproject.toml", "/README.md", "/LICENSE", "/tests", "/scripts"]
exclude = ["/packages/cli/src/fasthtml_tailwindcss_cli/bin"]
