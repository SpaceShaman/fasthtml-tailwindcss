[project]
name = "fasthtml-tailwindcss"
version = "4.3.3"
description = "Tailwind CSS for FastHTML with a persistent compiler across server reloads."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "TAILWIND-LICENSE"]
authors = [{ name = "SpaceShaman", email = "spaceshaman@tuta.io" }]
keywords = ["components", "css", "fasthtml", "tailwindcss", "web"]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["filelock>=3.16", "platformdirs>=4", "python-fasthtml>=0.14.13"]

[project.urls]
Documentation = "https://github.com/SpaceShaman/fasthtml-tailwindcss#readme"
Homepage = "https://github.com/SpaceShaman/fasthtml-tailwindcss"
Issues = "https://github.com/SpaceShaman/fasthtml-tailwindcss/issues"
Repository = "https://github.com/SpaceShaman/fasthtml-tailwindcss"

[dependency-groups]
test = ["httpx", "pytest", "uvicorn"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fasthtml_tailwindcss"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/hatch_build.py", "/binaries.json", "/pyproject.toml", "/README.md", "/LICENSE", "/TAILWIND-LICENSE", "/tests"]
exclude = ["/src/fasthtml_tailwindcss/bin"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
