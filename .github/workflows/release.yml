name: Release

on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check upstream and PyPI
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project python scripts/check_release.py
      - name: Build source distribution
        if: steps.check.outputs.release == 'true'
        run: uv build --sdist
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.release == 'true'
        with:
          name: source
          path: dist/*.tar.gz

  wheels:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/test.yml
    with:
      release: true

  tag:
    needs: [prepare, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: dist
      - name: Commit tested version and tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          test "$(git rev-parse HEAD)" = "$REVISION"
          python - <<'PY'
          import tarfile
          from pathlib import Path
          archive, = Path('dist').glob('*.tar.gz')
          with tarfile.open(archive) as source:
              for filename in ('pyproject.toml', 'binaries.json', 'TAILWIND-LICENSE'):
                  member = next(m for m in source.getmembers() if m.name.endswith('/' + filename))
                  Path(filename).write_bytes(source.extractfile(member).read())
          PY
          uv lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml binaries.json TAILWIND-LICENSE uv.lock
          if ! git diff --cached --quiet; then git commit -m "Release $VERSION"; fi
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "v$VERSION")" = "$(git rev-parse HEAD)"
          else
            git tag "v$VERSION"
          fi
          git push --atomic origin "HEAD:${{ github.event.repository.default_branch }}" "refs/tags/v$VERSION"

  publish:
    needs: tag
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
