name: Release

on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check upstream and PyPI
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project python scripts/check_release.py
      - name: Build source distributions
        if: steps.check.outputs.release == 'true'
        run: |
          uv lock
          uv build packages/cli --sdist --no-sources --out-dir "$PWD/dist"
          uv build --sdist --no-sources
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.release == 'true'
        with:
          name: sources
          path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.release == 'true'
        with:
          name: release-config
          path: |
            pyproject.toml
            packages/cli/pyproject.toml
            packages/cli/binaries.json
            packages/cli/TAILWIND-LICENSE
            uv.lock

  wheels:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/test.yml
    with:
      release: true

  tag:
    needs: [prepare, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-config
      - name: Commit tested versions and tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          test "$(git rev-parse HEAD)" = "$REVISION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml packages/cli/pyproject.toml packages/cli/binaries.json packages/cli/TAILWIND-LICENSE uv.lock
          if ! git diff --cached --quiet; then git commit -m "Release $VERSION"; fi
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "v$VERSION")" = "$(git rev-parse HEAD)"
          else
            git tag "v$VERSION"
          fi
          git push --atomic origin "HEAD:${{ github.event.repository.default_branch }}" "refs/tags/v$VERSION"

  publish:
    needs: [prepare, tag]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: sources
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Keep only files missing from PyPI
        run: uv run --no-project python scripts/filter_publish.py
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
