name: Test wheels

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: ubuntu-latest
            target: linux-x64-musl
          - os: ubuntu-24.04-arm
            target: linux-arm64-musl
          - os: macos-15-intel
            target: macos-x64
          - os: macos-latest
            target: macos-arm64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        if: inputs.release
        with:
          name: source
          path: source-dist
      - name: Unpack release sources
        if: inputs.release
        shell: bash
        run: |
          python - <<'PY'
          import shutil, tarfile
          from pathlib import Path
          archive, = Path('source-dist').glob('*.tar.gz')
          with tarfile.open(archive) as source:
              source.extractall('unpacked', filter='data')
          root, = Path('unpacked').iterdir()
          for item in root.iterdir():
              if item.is_dir():
                  shutil.copytree(item, item.name, dirs_exist_ok=True)
              else:
                  shutil.copyfile(item, item.name)
          PY
      - name: Build platform wheel
        env:
          TAILWIND_BUILD_TARGET: ${{ matrix.target }}
        run: uv build --wheel
      - name: Install and test wheel
        if: ${{ !contains(matrix.target, 'musl') }}
        shell: bash
        run: |
          uv venv
          uv pip install --group test dist/*.whl
          uv run --no-project python -m pytest -q
      - name: Test musl wheel on Alpine
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          docker run --rm -v "$PWD:/work" -w /work python:3.11-alpine sh -c \
            'pip install dist/*.whl pytest httpx uvicorn && python -m pytest -q'
      - uses: actions/upload-artifact@v4
        if: inputs.release
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
