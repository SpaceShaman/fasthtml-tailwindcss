name: Test wheels

on:
  pull_request:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: ubuntu-latest
            target: linux-x64-musl
          - os: ubuntu-24.04-arm
            target: linux-arm64-musl
          - os: macos-15-intel
            target: macos-x64
          - os: macos-latest
            target: macos-arm64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        if: inputs.release
        with:
          name: sources
          path: source-dist
      - name: Unpack release sources
        if: inputs.release
        shell: bash
        run: |
          python - <<'PY'
          import shutil, tarfile, tempfile
          from pathlib import Path

          archive, = Path("source-dist").glob("fasthtml_tailwindcss-*.tar.gz")
          with tempfile.TemporaryDirectory() as temporary, tarfile.open(archive) as source:
              source.extractall(temporary, filter="data")
              root, = Path(temporary).iterdir()
              shutil.copytree(root, Path.cwd(), dirs_exist_ok=True)
          PY
      - name: Build CLI wheel
        working-directory: packages/cli
        env:
          TAILWIND_BUILD_TARGET: ${{ matrix.target }}
        run: uv build --wheel --no-sources
      - name: Build wrapper wheel
        run: uv build --wheel --no-sources
      - name: Install and test wheels
        if: ${{ !contains(matrix.target, 'musl') }}
        shell: bash
        run: |
          uv venv
          uv pip install --group test dist/*.whl packages/cli/dist/*.whl
          uv run --no-project python -m pytest tests -q
      - name: Test musl wheels on Alpine
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          docker run --rm -v "$PWD:/work" -w /work python:3.11-alpine sh -c \
            'apk add --no-cache libstdc++ libgcc && pip install dist/*.whl packages/cli/dist/*.whl pytest httpx uvicorn && python -m pytest tests -q'
      - uses: actions/upload-artifact@v4
        if: inputs.release && matrix.target == 'linux-x64'
        with:
          name: wheel-wrapper
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.release
        with:
          name: wheel-cli-${{ matrix.target }}
          path: packages/cli/dist/*.whl
          if-no-files-found: error
